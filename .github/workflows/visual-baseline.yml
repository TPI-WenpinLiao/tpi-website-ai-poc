name: visual-baseline

# Regenerates the visual regression baselines (tests/visual/__screenshots__/) when the
# update-visual-baseline label is added to a PR, and commits them to the PR branch. Baselines only
# come from CI: text near a line-width threshold wraps differently on other machines (#24).
# A label rather than workflow_dispatch, so it works on the PR that changes this file too.
# Pushes made with GITHUB_TOKEN don't start quality-gate: the next push to the branch does.

on:
  pull_request:
    types: [labeled]

permissions: {}

concurrency:
  group: visual-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event.label.name == 'update-visual-baseline' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    # Same image as quality-gate, which compares against these baselines
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:visual:update
      - name: Commit changed baselines
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged" >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --cached --name-only >> "$GITHUB_STEP_SUMMARY"
            git commit -m "chore: 由 CI 更新視覺回歸 baseline（#${{ github.event.pull_request.number }}）" -m "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push origin "HEAD:$HEAD_REF"
          fi
      - name: Remove the label
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.payload.pull_request.number, name: 'update-visual-baseline' }).catch(() => {});
