name: quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The visual baselines (tests/visual/) are taken in this image by visual-baseline.yml, and only
    # in CI: text near a line-width threshold wraps differently on other machines (#24). Its tag
    # follows @playwright/test in package.json (scripts/lib/playwright-image.test.mjs).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      # Chromium refuses to start as root without --no-sandbox. Not LHCI_COLLECT__SETTINGS__*: that
      # one replaces lighthouserc.cjs's whole collect.settings (#136)
      LHCI_SETTINGS__CHROME_FLAGS: --no-sandbox --headless=new
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's merge commit and its first parent (the base), for lighthouse-scope.mjs --changed
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Docs-only PRs cannot change dist/, so Lighthouse is skipped for them (#129)
      - name: Lighthouse scope
        id: scope
        # checkout only marks the repo safe in a temporary HOME; the container runs as root on a
        # workspace owned by the runner user, so later git calls would not see a repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node scripts/ci/lighthouse-scope.mjs --changed
      - run: npm ci
      # Puppeteer checks and Lighthouse use the same Chromium as the visual regression tests
      - run: echo "CHROME_PATH=$(node -p "require('playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"
      # npm run check without its last step, Lighthouse, which runs below unless the PR is docs-only
      - run: npm run check:before-lighthouse
      # A stuck run fails after 3 minutes (scripts/lhci-run.mjs); this is the backstop. Normally
      # 8–9 minutes for 16 pages × 3 runs (#136, ADR 0004)
      - name: Lighthouse
        if: steps.scope.outputs.skip != 'true'
        timeout-minutes: 15
        run: npm run lighthouse
      - name: Verify DOCS_ONLY
        id: verify
        if: steps.scope.outputs.skip == 'true'
        run: node scripts/ci/lighthouse-scope.mjs --verify
      - name: Visual regression report
        if: failure() && hashFiles('playwright-report/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Lighthouse summary
        if: always()
        env:
          LIGHTHOUSE_SKIP: ${{ steps.scope.outputs.skip }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: node .github/scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"
