name: quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Chromium and fonts of the pinned @playwright/test, which the visual baselines were taken with
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Visual regression report
        if: failure() && hashFiles('playwright-report/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Lighthouse summary
        if: always()
        run: node .github/scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"
