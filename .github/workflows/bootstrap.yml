name: bootstrap

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Installs the `yaml` parser used by the bootstrap script.
      - run: npm ci --ignore-scripts
      - name: Create labels, milestones and issues
        uses: actions/github-script@v9
        with:
          script: |
            const bootstrap = require('./.github/scripts/bootstrap.cjs');
            await bootstrap({ github, context, core });
