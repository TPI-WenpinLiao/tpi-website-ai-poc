- id: M3-07
  title: 3D scroll 視覺方向原型
  milestone: M3
  labels: [type:feature, needs-design]
  gate: design-approved
  gateNote: 人工選定方向後加上 `design-approved`，M3-04、M3-05 才能開始。
  goal: |-
    以兩種 3D scroll 視覺方向製作首頁 hero 原型，驗證效果與效能可以並存，選定的方向作為 M3-04、M3-05 高保真的基礎。

    - 方向 A Data Flow：光點與光束組成的 3D 網路，鏡頭隨捲動前進，流線分流到各產品節點
    - 方向 B Modular Stack：等角視角的 3D 方塊隨捲動拆解、翻轉、重組
  deliverables:
    - 兩個原型頁，放在不進導覽、不進 sitemap 的路徑（路徑於 PR 中提出）
    - 3D 以 three.js 程式生成（粒子、幾何體、shader），不使用外部模型檔
    - "`docs/decisions/` 新增 ADR：3D island 的載入策略，以及與「預設零 client JS」原則如何並存"
    - PR 附兩案的行動版與桌機版 Lighthouse 數字與錄影
  acceptance:
    - LCP 元素是靜態圖，3D 在首屏顯示後才載入
    - "`prefers-reduced-motion: reduce` 時只顯示靜態版"
    - 行動版有降級設定（粒子數、鏡頭複雜度）
    - 兩案的行動版 Lighthouse performance 都量測並記錄；未達 0.95 的列出原因與改善方式
    - 文字內容使用現站事實，不捏造數據或客戶
    - 人工選定方向後加上 `design-approved`
  dependsOn: []

