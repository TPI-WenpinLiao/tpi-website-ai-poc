- id: M3-08
  title: 動態規範（motion tokens、reduced-motion、效能預算）
  milestone: M3
  labels: [type:docs]
  goal: 依 M3-07 選定的方向，定義全站動態的使用規則，讓 3D 與一般動畫在各頁一致且不影響可用性。
  deliverables:
    - "`src/styles/tokens.css` 新增動態 tokens（duration、easing、delay）"
    - |-
      `docs/design/motion.md`：
        - 可用的效果清單與適用頁面（真 3D 只用於首頁與產品頁亮點段落；其他頁面使用 CSS 偽 3D 或不使用）
        - `prefers-reduced-motion` 規則
        - 效能預算：3D island 的 JS 大小上限、行動版降級條件
    - 更新 `.claude/skills/design-system/SKILL.md` 的動態段落
  acceptance:
    - 每種效果都定義 reduced-motion 時的替代呈現
    - 效能預算有具體數字，並說明量測方式
    - 動態只引用 tokens，不寫死時間與 easing
  dependsOn: [M3-07]

