# Issue title is rendered as "[<id>] <title>" and used for idempotent matching.
# `gate`: the label a human adds after review; the issue is not done until it is present.
# `gateNote`: replaces the default sentence of the gate section (optional).
# `dependsOn`: ids resolved to issue numbers at bootstrap time (must appear earlier in this file).
# Issues edited on GitHub must be mirrored here; `node scripts/bootstrap/diff.mjs` lists the differences.

