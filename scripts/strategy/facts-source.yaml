  - group: Testimonials (home page)
    url: https://www.tpisoftware.com/
    locale: zh-TW
    comment: Each testimonial is the statement and its speaker; names, titles and quotes need the client's consent
    facts:
      - id: testimonial-nccu-fintech
        type: case
        quote: 昕力是台灣本土在 API 管理平台上，相較於國際來說，走得最前面，且是第一家開始投入相關技術的企業。昕力在 API 管理平台的技術和 Al 都提供很好的服務，在未來的開放銀行有很大的發揮效果，可擔任領頭羊，引領其他公司投入。
        status: to_confirm
        note: 證言，對外使用要取得說話人同意；「第一家」是證言中的說法
      - { id: testimonial-nccu-fintech-speaker, type: case, quote: 王儷玲 教授 ｜政大金融科技研究中心主任, status: to_confirm, note: 人物與職稱，對外使用要取得同意，職稱可能已變 }
      - id: testimonial-cathay-fhc
        type: case
        quote: 此次與昕力的合作我們就像同一個團隊般合作無間，目前SysTalk已經涵蓋了我們旗下50％以上的用戶服務量，在滿意度回饋上也超過了真人客服，透過昕力的最佳技術與完整客戶體驗的合作，我們獲得了相當好的成果。
        status: to_confirm
        note: 客戶證言，對外使用要取得客戶同意；50％ 是當時的數字，可能過時
      - id: testimonial-cathay-fhc-speaker
        type: case
        quote: 姚旭杰 ｜國泰金控數數發中心資深副總
        status: to_confirm
        note: 人物與職稱，對外使用要取得同意，職稱可能已變；委外服務頁也引用這則證言
      - id: testimonial-excellence-wire
        type: case
        quote: 卓新是結構化綜合佈線領導廠商，客戶遍及全球各地，此次與昕力資訊合作，導入 RPA 流程自動化，不但改善了員工工作的效率，讓人才發揮最大的價值，在內部流程革新之下，促使企業營運朝數位轉型前進，以因應快速轉變的時代，為卓新發展帶來極大助益，並保持競爭力的關鍵！
        status: to_confirm
        note: 客戶證言，對外使用要取得客戶同意
      - { id: testimonial-excellence-wire-speaker, type: case, quote: 楊秀鳳 ｜卓新工業業務副總, status: to_confirm, note: 人物與職稱，對外使用要取得同意，職稱可能已變 }
      - id: testimonial-youbike
        type: case
        quote: 一直以來我們都希望讓 YouBike 公共自行車不只是交通工具，而是能直接融入大眾生活，為民眾帶來便利的服務，而本次與昕力資訊合作的 AI 智能客服，導入之後，我們挖掘了一塊新的服務市場，我覺得這是我們最大的收穫；我們已經規劃第二階段的開發計畫，希望能夠持續跟昕力資訊一起合作，把我們的 YouBike 客服小管家智能客服精進，讓它整個服務面更廣闊。
        status: to_confirm
        note: 客戶證言，對外使用要取得客戶同意
      - { id: testimonial-youbike-speaker, type: case, quote: 莊博欽 ｜微笑單車股份有限公司 企劃經理兼中營處長, status: to_confirm, note: 人物與職稱，對外使用要取得同意，職稱可能已變 }
      - id: testimonial-shin-kong-bank
        type: case
        quote: 在這個平台上它提供IT人員可以做後台管理也考慮到很多安控，昕力在這個產品上已經蠻替IT人員想到蠻多; 昕力在一些新進的技術上面其實一直都走得蠻前面的，也很願意分享給我們，那整個團隊的服務都非常棒，我們一定會再繼續跟他們合作。
