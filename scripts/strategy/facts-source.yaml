  - group: DigiLism
    url: https://www.tpisoftware.com/products/digilism
    locale: zh-TW
    facts:
      - { id: digilism-ipaas, type: feature, quote: 兼具高度擴充、延展能耐的應用整合服務平台 （iPaaS），可在雲端、地端及地雲混和環境中佈署， 適於金融、保險及各領域應用。 }
      - { id: digilism-patent-background-processing, type: feature, quote: 具備專利技術的背景服務運算處理，支援處理瞬間大量的數據或請求，達到零阻塞式運行。 }
      - { id: digilism-patent-resource-scheduling, type: feature, text: 專利技術的運算資源調度機制、靈活調配，以提高資訊系統可用性。, quote: '專利技術的運算資源調度機制、靈活調配，,以提高資訊系統可用性。' }
      - { id: digilism-patent-sla, type: feature, quote: 自適應負載平衡機制及紅黑佈署策略的專利技術，確保100% 符合服務水平協議（SLA）。, status: to_confirm, note: 沒有依據或比較基準的成效數字或最高級說法，與 digirunner-hot-deploy-50、TCO 低 40% 同類（#164 使用者決定） }
      - { id: digilism-system-integration, type: feature, quote: 結合 DevOps 與 CI/CD 流程、整合 API 管理、BPM、日誌管理，支援地端、雲端、雲地混合與多雲架構，介接大型企業的傳統 ESB }
      - { id: digilism-microservice-framework, type: feature, quote: DigiLism 以 K8S 滿足系統高可用性，直接實踐微服務架構的 BFF （Backend for Frontend），並以自有自動擴容 （Auto-scaling）研發專利技術，讓系統具備佈署彈性。 }
      - { id: digilism-auth-module, type: feature, quote: 提供多元身分驗證、驗身機制及安控機制的整合，包含訪問控制、資料加密和單一登入（SSO）等，同時內建組織階層管理 }
      - { id: digilism-log-audit, type: feature, quote: 記錄分散於各系統或 AP 的所有日誌，透過集中控管、即時監控告警，提供第一線 IT 人員精確即時查找、分析系統問題來源 }
      - { id: digilism-protocol-integration, type: feature, quote: 以微服務架構的 DigiLism 專門協助處理核心銀行系統或過時大型機的資料轉換及通訊機制變更，可代替企業服務匯流排（ESB） }
      - { id: digilism-sla-100, type: feature, quote: 100 % SLA 智慧快取、負載平衡、平行處理、容器延展四大原生內建機制，可確保每個 API、服務、通道和佈署皆擁有優異效能，讓系統服務穩定、運行不中斷，從而實現 100％ 的服務水平協定 （SLA）。, status: to_confirm, note: 沒有依據或比較基準的成效數字或最高級說法，與 digirunner-hot-deploy-50、TCO 低 40% 同類（#164 使用者決定） }
      - { id: digilism-solution-areas, type: feature, quote: DigiLism 系列提供 API 管理、日誌管理及大數據管理三大面向解決方案 }
      - { id: digilism-family-digirunner, type: feature, quote: 整合 MCP 協定與 AI Gateway 架構，讓 AI 模型安全串接企業 API、資料與業務流程 }
      - id: digilism-family-digilogs
        type: feature
        quote: 以業界唯一鏈路追蹤技術集中管理系統日誌，整合可視化拓樸、EDR、RCA 與智慧告警，協助企業即時除錯、高效維運。
        status: to_confirm
        note: 「業界唯一」是最高級宣稱，現站沒有寫出依據
      - { id: digilism-family-digimars, type: feature, quote: 將 MongoDB 社群版升級至商用等級，提供效能監控、告警與備份還原，降低資料庫管理成本，並附 7×24 技術支援。 }
      - { id: digilism-family-digiflexis, type: feature, quote: 以零代碼設計快速建立數位表單與自動化流程，搭配智能報表即時洞察營運數據 }
      - { id: digilism-family-digicare, type: feature, quote: 以 HL7 FHIR 為核心架構，將異質系統的分散資料整併為可互通的標準格式，實現跨系統、跨院交換，並遵循衛福部 FHIR 實作指引。 }

  - group: digiLogs
    url: https://www.tpisoftware.com/products/digilogs
    locale: zh-TW
    facts:
      - id: digilogs-claim-2-minutes
        type: feature
        quote: 業界唯一主動識別科技 2分鐘定位問題
        status: to_confirm
        note: 「業界唯一」是最高級宣稱，現站沒有寫出依據；2 分鐘沒有寫出量測條件
      - { id: digilogs-rca-2-minutes, type: feature, quote: RCA 根因分析 輕鬆掌握、迅速應對異常 2分鐘除錯 高效復歸 }
      - { id: digilogs-55-formats, type: feature, quote: digiLogs 集中化日誌管理平台，支援超過 55 種系統資料格式的無差別蒐集，提供解析邏輯、日誌資料萃取保存，以及多元的查詢機制—全文檢索、關鍵字查詢、和鏈路式關聯查詢。 }
      - { id: digilogs-collectors, type: feature, quote: Agent-based 即時、無間斷收集系統完整日誌，確保每一項記錄都被精確保存。 Agentless 捕捉系統主機的效能關鍵指標，輕鬆掌握系統狀態。 API Collector 記錄和監視 API 的調用情況 }
      - { id: digilogs-distributed-tracing, type: feature, quote: digiLogs 利用分散式跟蹤（Distributed Tracing）提升排查效率，進而透過根因分析（Root Cause Analysis）精準定位問題所在 }
      - { id: digilogs-edr, type: feature, quote: EDR 端點監控 全視系統監控圖 }
      - { id: digilogs-siem, type: feature, quote: digiLogs 分析資料可作為 SIEM 資安控管的一環。 }
      - { id: digilogs-10000-eps, type: feature, quote: '支援 10,000 EPS，整合多條件的複合告警設定。' }
      - { id: digilogs-iso27001-encryption, type: feature, quote: 在日誌收集、傳輸的過程中，透過 SSL / mTLS、RSA 加密技術及私鑰解密驗證等機制，達到資料的來源不可否認性與資料完整性 }
      - { id: digilogs-iso27001-audit, type: feature, quote: 助力企業進一步通過 ISO 27001 稽核。 }
      - { id: digilogs-case-bank-path-map, type: case, quote: digiLogs 協助為某銀行蒐集系統資料，而後進行資料統合、解析及重新定義後於單一平台呈現，並透過交易路徑地圖，以不同權限層級的劃分，當系統發生問題時，快速標記出問題點，同步自動向維運人員提出示警，加快查找問題所在並進行修復。 }
      - id: digilogs-case-cathay-life
        type: case
        quote: 國泰人壽每月約需存取 6 TB 的 logs日誌數據，透過 digiLogs 快速的水平擴展機制（分片），能夠整合多台系統資料運作記錄，進一步整合及分析，並匯入同一平台輕鬆管理大量且每日增長的數據資料。
        status: to_confirm
        note: 寫出客戶名稱，對外使用要確認授權；數據量是當時的數字
      - id: digilogs-case-online-banking
        type: case
        quote: 銀行端系統客戶單日日誌收集數據量多達 50 GB（每月約1.5 TB），舊有系統維運能力有限且難應對日趨複雜的管理需求。導入昕力自有研發產品「 digiLogs 」後，因其單一介面跨平台 log 查詢、流量監控、視覺化報表統計、即時告警等特點，管理效率大增。
      - { id: digilogs-case-online-banking-title, type: case, quote: 網路銀行日誌管理 }

