# Input of scripts/strategy/extract-facts.mjs (#164): the facts picked from the current site.
# The script checks every quote against its page and writes docs/strategy/facts.yaml; edit this file,
# never facts.yaml. Format and rules: .claude/skills/site-research/SKILL.md「事實庫」.
#
#   groups[]   group: heading written as a comment; url, locale: defaults for its facts;
#              comment: optional line written under the heading
#     facts[]  id, type, quote (verbatim from the page); optional: text (defaults to quote), url,
#              locale, status (defaults to confirmed), note (required for to_confirm), comment
#   ignore[]   match: a regex over a text block of docs/strategy/facts-candidates.md;
#              reason: why blocks it matches are not facts (shown in the report)
#
# Ids already used by pages must not change (node scripts/strategy/facts.mjs fails on a missing one).

