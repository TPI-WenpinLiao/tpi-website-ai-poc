# Manual input for case-studies.mjs (M5-03, #28); docs/content/migration.md「成功案例」.
#
# clients: logo key (the card's logo file name without locale variants, logoKey() in case-studies.mjs)
#   → slug (the start of every case slug of the client) and the client's name per locale, written the
#   way that locale's descriptions write it. A name the descriptions do not contain is read off the
#   logo and marked「logo」. Names, logos and the right to show them are to be confirmed (PR #28).
# entries: entry id → frontmatter that replaces the generated value (title, seoTitle, description).
#   cardDescription replaces the card text itself where the site's is wrong; the body, offerings
#   and description follow it, and it is not written to the frontmatter (#40).
#   zh-TW, en (M7-02) and vi (M7-03) descriptions are rewritten to the seo-checklist length; en and vi
#   seoTitle shortens the generated「client: title」where <title> would pass 70 characters.

